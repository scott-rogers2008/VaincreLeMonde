<!-- src/frontend/src/app/components/study-loader/study-loader.component.html -->
<div class="study-container">
  
  <!-- Ingestion Service Navigation Header Bar -->
  <mat-toolbar color="primary" class="study-header">
    <span>📥 Content Ingestion Gateway Pipeline</span>
  </mat-toolbar>

  <!-- GENERALIZED INGESTION PANEL DECK -->
  <div class="ingest-card">
    <h2 class="ingest-title">📦 Dynamic Curriculum Setup</h2>
    <p class="pedagogical-intent">
      Process selected web addresses or conference material streams to slice linguistic structures and generate AI-guided quiz blocks.
    </p>

    <div class="form-group">
      <div class="input-field-wrapper">
        <label class="form-label">DISCOURSE SOURCE ADDRESS URL</label>
        <input type="text" 
               [(ngModel)]="targetUrl" 
               placeholder="https://churchofjesuschrist.org..." 
               class="styled-input">
      </div>

      <div class="input-field-wrapper">
        <label class="form-label">DOCUMENT OVERRIDE TITLE (FILENAME)</label>
        <input type="text" 
               [(ngModel)]="customTitle" 
               placeholder="e.g., soul_sculpting_analysis.md (Leave blank to derive from URL)" 
               class="styled-input">
      </div>

      <div class="input-field-wrapper">
        <label class="form-label">TARGET STUDY LANGUAGE</label>
        <select [(ngModel)]="chosenLanguage" class="styled-select">
          <option *ngFor="let lang of languageTracks" [value]="lang">{{ lang }}</option>
        </select>
      </div>

      <button [disabled]="isProcessing" (click)="triggerContentIngestion()" class="action-submit-btn">
        <span *ngIf="!isProcessing">🔄 Synchronize Learning Matrix</span>
        <span *ngIf="isProcessing">⚡ Processing & Simulating Ingestion Mesh Channels...</span>
      </button>
    </div>

    <!-- Telemetry status logs mirror the background state execution responses safely -->
    <div *ngIf="statusMessage" class="telemetry-log" 
         [ngClass]="statusMessage.includes('❌') || statusMessage.includes('⚠️') ? 'error' : 'success'">
      {{ statusMessage }}
    </div>
  </div>

</div>
